<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <header>
      <h1>Rock Paper Scissors</h1>
      <p class="subtitle">Play against the computer!</p>
    </header>

    <!-- Running Scoreboard -->
    <section class="scoreboard">
      <div class="score-card">
        <span class="player-label">You</span>
        <span id="player-score" class="score-value">0</span>
      </div>
      <div class="score-divider">:</div>
      <div class="score-card">
        <span class="player-label">Computer</span>
        <span id="computer-score" class="score-value">0</span>
      </div>
    </section>

    <!-- Choice Action Buttons -->
    <section class="choices-section">
      <p class="instruction">Choose your move:</p>
      <div class="choices-container">
        <button class="choice-btn" data-choice="rock" aria-label="Rock">
          <span class="icon">✊</span>
          <span class="label">Rock</span>
        </button>
        <button class="choice-btn" data-choice="paper" aria-label="Paper">
          <span class="icon">✋</span>
          <span class="label">Paper</span>
        </button>
        <button class="choice-btn" data-choice="scissors" aria-label="Scissors">
          <span class="icon">✌️</span>
          <span class="label">Scissors</span>
        </button>
      </div>
    </section>

    <!-- Round Summary & Outcome Display -->
    <section class="results-section">
      <div class="battle-display">
        <div class="pick-box">
          <span class="pick-label">Your Pick</span>
          <div id="player-pick" class="pick-icon">❓</div>
        </div>
        <span class="vs-text">VS</span>
        <div class="pick-box">
          <span class="pick-label">Computer Pick</span>
          <div id="computer-pick" class="pick-icon">❓</div>
        </div>
      </div>
      <div id="round-message" class="round-message">Select a move to begin!</div>
    </section>

    <!-- Controls -->
    <footer>
      <button id="reset-btn" class="reset-btn">Reset Score</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
